<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Game – Homepage</title>
  <link rel="stylesheet" href="css/homepage.css">
  <link rel="stylesheet" href="css/notification.css">
</head>
<body>
  <div id="notification-container"></div>
  <!-- Top navigation bar -->
  <header class="top-bar">
    <div class="logo">
      <h1>🌱 Pixel Grove</h1>
    </div>
    <nav class="nav-menu">
      <a href="challenges.html" class="nav-link">Challenges</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <a href="shop.html" class="nav-link">Shop</a>
      <a href="leaderboard.html" class="btn-leaderboard">🏆</a>
    </nav>
    <div class="stats">
      <span id="username-display">Loading...</span>
      <span id="points-display">Points: 0</span>
      <span id="networth-display">Net Worth: $0</span>
    </div>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </header>

  <!-- Main garden view -->
  <main class="garden-main">
    <div class="garden-container">
      <h2>🌻 Garden</h2>
      <div class="garden-stats">
        <p>Plots used: <span id="plots-used">0</span>/20</p>
        <p>Total Garden Value: $<span id="garden-value">0</span></p>
      </div>
      
      <div id="garden-plots" class="garden-grid">
        <!-- Garden plots will be loaded dynamically -->
       
      </div>

      <div class="garden-actions">
        <button id="harvest-all-btn" class="btn-primary">Harvest All Plants</button>
        <a href="inventory.html" class="btn-secondary">Plant from Inventory</a>
      </div>
    </div>
  </main>

<script src="js/notifications.js"></script>
<script src="js/queryCmds.js"></script>
<script src="js/getCurrentURL.js"></script>
<script type="module" src="js/homepage.js"></script>
</body>
</html>
