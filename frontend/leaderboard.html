<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Game – Leaderboard</title>
  <link rel="stylesheet" href="css/leaderboard.css">
  <link rel="stylesheet" href="css/notification.css">
</head>
<body>
  <div id="notification-container"></div>
  
  <header class="top-bar">
    <div class="logo">
      <a href="homepage.html">🌱 Pixel Grove</a>
    </div>
    <div class="stats">
      <span id="points-display">Points: 0</span>
      <span id="networth-display">Net Worth: $0</span>
    </div>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </header>

  <main class="leaderboard-container">
    <div class="leaderboard-header">
      <h1>🏆 Net Worth Leaderboard</h1>
      <p>Top Players by Net Worth</p>
    </div>

    <!-- Leaderboard List -->
    <div id="leaderboard-list" class="leaderboard-list">
      <div class="loading">Loading leaderboard...</div>
    </div>

    <div class="back-link">
      <a href="homepage.html" class="btn-secondary">← Back to Dashboard</a>
    </div>
  </main>

 <script type="module" src="js/notifications.js"></script>
  <script src="js/queryCmds.js"></script>
  <script src="js/getCurrentURL.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
