<!-- garden.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Game – My Garden</title>
  <link rel="stylesheet" href="css/garden.css">
</head>
<body>
  <header class="top-bar">
    <div class="logo">
      <a href="homepage.html">🌱 Garden Wellness</a>
    </div>
    <div class="stats">
      <span id="points-display">Points: 0</span>
      <span id="networth-display">Net Worth: $0</span>
    </div>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </header>

  <main class="garden-container">
    <div class="garden-header">
      <h1>🌻 My Garden</h1>
      <p>Click on a planted plot to sell the plant and earn money!</p>
      <p class="plots-info">Plots used: <span id="plots-used">0</span>/20</p>
    </div>

    <div class="garden-grid" id="garden-grid">
      <!-- Grid cells will be generated dynamically (20 plots) -->
    </div>

    <div class="garden-legend">
      <h3>Legend:</h3>
      <ul>
        <li><span class="legend-empty"></span> Empty Plot (Go to Inventory to plant)</li>
        <li><span class="legend-planted"></span> Planted (Click to sell)</li>
      </ul>
    </div>

    <div class="back-link">
      <a href="homepage.html" class="btn-secondary">← Back to Dashboard</a>
    </div>
  </main>

  <!-- Sell Confirmation Modal -->
  <div id="sell-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Sell Plant</h2>
      <p id="modal-plant-info"></p>
      <p id="modal-sell-value"></p>
      <div class="modal-buttons">
        <button id="confirm-sell-btn" class="btn-primary">Confirm Sell</button>
        <button id="cancel-sell-btn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
 <script src="js/queryCmds.js"></script>
<script src="js/getCurrentURL.js"></script>
  <script src="js/garden.js"></script>
</body>
</html>
