<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Game – Challenges</title>
  <link rel="stylesheet" href="css/challenges.css">
</head>
<body>
  <header class="top-bar">
    <div class="logo">
      <a href="homepage.html">🌱 Pixel Grove</a>
    </div>
    <div class="stats">
      <span id="points-display">Points: 0</span>
      <span id="networth-display">Net Worth: $0</span>
    </div>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </header>

  <main class="challenges-container">
    <div class="challenges-header">
      <h1>🏆 Wellness Challenges</h1>
      <p>Complete challenges to earn points! Bonus 1.5x points between 6-8 AM.</p>
      <p class="cooldown-info">⏰ Each challenge can be completed once every 24 hours</p>
    </div>

    <div id="challenges-list" class="challenges-list">
      <div class="loading">Loading challenges...</div>
    </div>

    <div class="back-link">
      <a href="homepage.html" class="btn-secondary">← Back to Dashboard</a>
    </div>
  </main>

  <!-- Completion Modal -->
  <div id="completion-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Complete Challenge</h2>
      <p id="modal-challenge-name"></p>
      <p id="modal-challenge-points"></p>
      <form id="completion-form">
        <label for="completion-details">Share your experience:</label>
        <textarea id="completion-details" required placeholder="Describe how you completed this challenge..."></textarea>
        <button type="submit" class="btn-primary">Submit Completion</button>
      </form>
    </div>
  </div>
 <script src="js/queryCmds.js"></script>
<script src="js/getCurrentURL.js"></script>
  <script src="js/challenges.js"></script>
</body>
</html>
